<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paslaptingoji 13-oji byla</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f6efd9;background:#101b2b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#30445a,#101b2b 60%);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd77e;outline-offset:3px}.shell{max-width:1060px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.logo{letter-spacing:.1em;color:#f5d99b;font-size:13px;font-weight:bold}.panel{border:1px solid #65738a;border-radius:18px;background:#19283bdf;padding:25px;box-shadow:0 15px 45px #0005}.hero{text-align:center;min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}.hero h1{font-size:clamp(34px,6vw,70px);line-height:1.1;margin:0;color:#ffe0a1}.sub{color:#c8d2de;max-width:680px;line-height:1.6}.scene{font-size:65px;letter-spacing:15px}.btn{background:#e8bd70;color:#172233;border:0;border-radius:12px;padding:13px 19px;font-weight:800}.btn:hover{background:#ffdb98}.secondary{background:#34475f;color:white}.secondary:hover{background:#435b76}.ghost{background:transparent;border:1px solid #8495a8;color:#fff}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#c1ccda}.small{font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.suspect{border:1px solid #67788d;border-radius:14px;background:#24364a;padding:15px}.avatar{font-size:48px;text-align:center}.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.evidence article{border:1px solid #748399;background:#24364a;border-radius:12px;padding:12px;min-height:100px}.locked{opacity:.5}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.step{padding:12px 5px;border:1px solid #8190a2;border-radius:9px;text-align:center;background:#283a4d}.step.current{background:#765b37}.step.done{background:#2e594e}.content{max-width:790px;margin:20px auto}.question{font-size:20px;font-weight:bold;color:#ffe2a9}.choice{display:block;padding:13px;margin:9px 0;border:1px solid #708196;border-radius:10px;background:#26394e;cursor:pointer}.choice:has(input:checked){border-color:#ffd27d;background:#4b4a46}.choice input{margin-right:10px;accent-color:#f0c475}.feedback{margin-top:14px;padding:13px;border-radius:10px;background:#30465b}.good{border-left:5px solid #86dfac}.bad{border-left:5px solid #f3a6a1}.hint{border-left:5px solid #ffd47c}.paper{background:#ead9b3;color:#302b25;border-radius:12px;padding:19px;line-height:1.75;font-size:18px;box-shadow:inset 0 0 20px #b69d6a66}.paper p{margin:0}.timeline{width:100%;border-collapse:collapse}.timeline td,.timeline th{border-bottom:1px solid #6e8090;padding:10px;text-align:left}.archive{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.archive button{min-height:100px;border-radius:12px;border:2px solid #667a8d;background:#304258;color:#fff;padding:8px}.archive button.chosen{border-color:#ffd47c;background:#665338}.archive button:disabled{opacity:.5}.archive .stripes{color:#e8c987;font-weight:bold;letter-spacing:4px}.checkrow{display:block;margin:9px 0;padding:10px;background:#293c50;border-radius:9px}h2{color:#ffe0a1}h3{margin-bottom:8px}.footer{margin-top:20px;color:#b5c3d0;text-align:center;font-size:12px}@media(max-width:650px){.shell{padding:12px}.panel{padding:16px}.cards{grid-template-columns:1fr}.steps{grid-template-columns:repeat(7,1fr)}.step{font-size:12px}.scene{font-size:45px;letter-spacing:4px}.archive{gap:6px}.archive button{font-size:12px}}@media print{body{background:white;color:black}.top,.no-print,.btn{display:none!important}.panel{background:white;color:black;border:1px solid #777;box-shadow:none}.paper{box-shadow:none}.shell{max-width:none}}
</style></head><body><div id="app" class="shell"></div><footer style="text-align:center;padding:14px 20px 22px;font:13px Arial,sans-serif"><a href="https://korsigita.com/privatumo-politika/" target="_blank" rel="noopener noreferrer" style="color:#f5d99b;text-decoration:underline">Privatumo politika</a></footer><script>
const KEY='byla13_v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{stage:0,done:[],answers:{}}}catch(e){state={stage:0,done:[],answers:{}}}let screen='start',feedback='',hint=false,selection='',keyAnswers=['','',''],archiveChoice='',finalWho='',finalWhy='',finalEvidence=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Laiškas be parašo','Raktų žurnalas','Šešėlis koridoriuje','Dvi rudens tradicijos','Sustojęs laikrodis','Melagingas pėdsakas','Archyvo paslaptis'];const clues=['Slaptas žodis RAKTAS nurodo tikrinti spintos raktus.','Emilija turėjo spintos raktą nuo 22.40 iki 22.50 val.','22.53 val. į archyvą ėjo asmuo mėlynais drabužiais ir dryžuota dėže rankose.','Knyga buvo ruošiama mokyklos atminimo renginiui.','Emilijos nurodytas rakto grąžinimo laikas prieštarauja raktų žurnalui.','Prie spintos lašėjo vanduo. Knygą galėjo reikėti apsaugoti.','Knyga rasta archyvo B3 dėžėje su Emilijos pasirašytu lapeliu.'];
function btn(t,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function header(){return `<div class="top"><div class="logo">BYLA NR. 13 · MOKYKLOS PASLAPČIŲ TYRIMŲ BIURAS</div><div class="bar no-print">${btn('Tyrimo būstinė','home()','btn secondary')}${btn('Pradėti iš naujo','resetGame()','btn ghost')}</div></div>`}function render(){let html=header();if(screen==='resetConfirm')html+=`<main class="panel content"><h1>Pradėti tyrimą iš naujo?</h1><p>Visi surinkti įrodymai ir tyrimų pažanga bus ištrinti. Ar tikrai norite pradėti iš naujo?</p><div class="bar">${btn('Taip, pradėti iš naujo','confirmReset()')}${btn('Ne, grįžti į būstinę','cancelReset()','btn secondary')}</div></main>`;else if(screen==='start')html+=`<main class="panel hero"><div class="scene" aria-hidden="true">🕰️ 📖 🗝️</div><div class="logo">SLAPTA DETEKTYVŲ MISIJA</div><h1>Paslaptingoji<br>13-oji byla</h1><p class="sub">Iš senos mokyklos bibliotekos dingo knyga „Užmirštos istorijos“. Laikrodis sustojo 23.13 val. Trys žmonės žino daugiau, nei pasako. Surink septynis įrodymus ir išspręsk bylą.</p>${btn('Pradėti tyrimą','home()')}<p class="small muted">4–5 klasė · 7 tyrimai · apie 40–50 minučių</p></main>`;
if(screen==='home')html+=`<main class="panel"><h1>Tyrimo būstinė</h1><p class="muted">Byla Nr. 13. Knyga dingo iš užrakintos spintos. Išsiaiškink, kas ją perkėlė, kur ji yra ir kodėl.</p><h2>Įtariamieji</h2><div class="cards"><div class="suspect"><div class="avatar" aria-hidden="true">🧔🏻‍♂️🔑</div><h3>Antanas</h3><p>Mokyklos sargas. Turi atsarginį bibliotekos raktą. Sako 23.00 val. užrakinęs biblioteką.</p></div><div class="suspect"><div class="avatar" aria-hidden="true">👩🏻‍💼📘</div><h3>Emilija</h3><p>Bibliotekos padėjėja. Vilki mėlyną megztinį. Sako grąžinusi raktą 22.45 val.</p></div><div class="suspect"><div class="avatar" aria-hidden="true">🧒🏻🦇</div><h3>Matas</h3><p>Penktokas. Koridoriuje kabino Helovino dekoracijas. Sako į biblioteką neužėjęs.</p></div></div><h2>Tyrimo etapai</h2><div class="steps">${names.map((n,i)=>`<div class="step ${state.done.includes(i)?'done':state.stage===i?'current':'locked'}" title="${n}">${i+1}${state.done.includes(i)?' ✓':''}</div>`).join('')}</div><p class="muted">Surinkta įrodymų: ${state.done.length} iš 7</p><div class="bar">${btn(state.done.length===7?'Pateikti bylos išvadą':'Tęsti tyrimą',state.done.length===7?'goFinal()':'goTask()')}${btn('Peržiūrėti įrodymus','goEvidence()','btn secondary')}</div></main>`;
if(screen==='evidence')html+=`<main class="panel"><h1>Surinkti įrodymai</h1><div class="evidence">${clues.map((x,i)=>`<article class="${state.done.includes(i)?'':'locked'}"><strong>Įrodymas ${i+1}</strong><p>${state.done.includes(i)?x:'Dar neatrastas'}</p></article>`).join('')}</div><p>${btn('Grįžti į būstinę','home()')}</p></main>`;
if(screen==='task')html+=taskHtml();if(screen==='final')html+=finalHtml();$('app').innerHTML=html+'<div class="footer">Paslaptingoji 13-oji byla · Lietuviškas edukacinis žaidimas</div>';}
function home(){screen='home';feedback='';hint=false;render()}function goTask(){screen='task';feedback='';hint=false;selection='';keyAnswers=['','',''];render()}function goEvidence(){screen='evidence';render()}function goFinal(){screen='final';feedback='';render()}function resetGame(){screen='resetConfirm';feedback='';render()}function cancelReset(){screen='home';render()}function confirmReset(){state={stage:0,done:[],answers:{}};selection='';keyAnswers=['','',''];archiveChoice='';finalWho='';finalWhy='';finalEvidence=[];feedback='';hint=false;save();screen='start';render()}
function taskHtml(){let i=state.stage;let intro=`<main class="panel content"><div class="logo">TYRIMAS ${i+1} IŠ 7</div><h1>${names[i]}</h1>`;let body='';if(i===0)body=`<p>Juodame voke rasta žinutė. Jos autorius paslėpė šešių raidžių žodį.</p><div class="paper"><p>Rūsyje tyliai girgžda durys.<br>Ant stalo dega maža lempa.<br>Knygų lentynose šlama lapai.<br>Tamsus koridorius atrodo tuščias.<br>Ant grindų guli senas vokas.<br>Spintoje kažko trūksta.</p></div><p class="question">Kokį žodį slepia laiškas?</p><input id="word" maxlength="20" autocomplete="off" placeholder="Įrašyk žodį" style="padding:13px;border-radius:9px;width:100%;max-width:300px">`;
if(i===1)body=`<p><strong>Tyrimo tikslas:</strong> knyga buvo laikoma užrakintoje spintoje. Išsiaiškink, kas galėjo ją atrakinti. Skaityk raktų registracijos žurnalą ir atsakyk į tris klausimus.</p><table class="timeline"><tr><th>Laikas</th><th>Įvykis</th></tr><tr><td>22.30</td><td>Antanas patikrino spintos užraktą.</td></tr><tr><td>22.40</td><td>Emilija pasiskolino spintos raktą.</td></tr><tr><td>22.50</td><td>Emilija grąžino raktą Antanui.</td></tr><tr><td>23.00</td><td>Antanas užrakino bibliotekos duris.</td></tr></table><p class="question">1. Kas pasiskolino spintos raktą?</p>${keyChoices(0,['Antanas','Emilija','Matas'])}<p class="question">2. Kiek laiko Emilija turėjo spintos raktą?</p>${keyChoices(1,['5 minutes','10 minučių','20 minučių'])}<p class="question">3. Ką galima pagrįstai teigti?</p>${keyChoices(2,['Emilija tikrai paėmė knygą.','Emilija galėjo atrakinti spintą, bet dar nežinome, ar paėmė knygą.','Niekas negalėjo atrakinti spintos.'])}`;
if(i===2)body=`<p>Kameros įraše 22.53 val. matyti žmogus, einantis nuo bibliotekos archyvo link. Veido nesimato.</p><div class="paper"><strong>Kameros kadro požymiai</strong><p>● Mėlyni drabužiai<br>● Kartoninė dėžė su trimis įstrižomis juostomis<br>● Iš dėžės kyšo knygos kampas</p></div><p class="question">Kurio asmens aprašymas labiausiai atitinka požymius?</p>${choices(['Antanas: žalia striukė, įrankių dėžė.','Emilija: mėlynas megztinis, dryžuota kartoninė dėžė.','Matas: juodas apsiaustas, dekoracijų maišas.','Nė vienas požymis nesutampa.'])}`;
if(i===3)body=`<p>Atkurk suplėšytą mokyklos renginio programą. Kiekvienam teiginiui parink tinkamą grupę.</p>${['Mirusių artimųjų prisiminimas','Persirengimas fantastiniais personažais','Žvakių uždegimas artimųjų atminimui','Išskaptuotas moliūgas su veidu','Rudens vakaras','Pasakojimai apie praeitį'].map((s,j)=>`<label class="checkrow"><strong>${j+1}. ${s}</strong><br><select id="trad${j}" style="margin-top:8px;padding:8px;width:100%"><option value="">Pasirink</option><option value="v">Vėlinės</option><option value="h">Helovinas</option><option value="a">Abi tradicijos</option></select></label>`).join('')}`;
if(i===4)body=`<p>Sieninis laikrodis sustojo 23.13 val. Perskaityk įtariamųjų parodymus.</p><div class="paper"><p><strong>Antanas:</strong> „22.50 val. Emilija man grąžino raktą.“</p><p><strong>Emilija:</strong> „Spintos raktą Antanui grąžinau 22.45 val. Po to nuėjau į archyvą.“</p><p><strong>Matas:</strong> „22.55 val. dar kabinau dekoracijas koridoriuje.“</p></div><p class="question">Kurio asmens parodymas prieštarauja raktų žurnalui?</p>${choices(['Antano','Emilijos','Mato','Visų trijų'])}`;
if(i===5)body=`<p>Prie spintos rastas popierinis šikšnosparnis ir vandens lašai. Ant durų yra 22.35 val. pranešimas:</p><div class="paper">„Prie senųjų knygų spintos nuo lubų laša vanduo. Būtina apsaugoti knygas.“</div><p class="question">Kuri išvada geriausiai pagrįsta?</p>${choices(['Matas paėmė knygą, nes rastas šikšnosparnis.','Knyga galėjo būti perkelta, siekiant apsaugoti ją nuo vandens.','Antanas sugadino stogą, kad paslėptų knygą.','Knyga pati nukrito nuo lentynos.'])}`;
if(i===6)body=`<p>Archyve yra šešios dėžės. Naudok visas tris užuominas ir surask vienintelę tinkamą.</p><div class="paper"><strong>Archyvo užuominos</strong><p>1. Knyga ne viršutinėje lentynoje.<br>2. Dėžė nėra skirta dekoracijoms.<br>3. Dėžė pažymėta trimis įstrižomis juostomis.</p></div><p class="question">Kurioje dėžėje gali būti knyga?</p><div class="archive">${[['A1','Nuotraukos',1],['A2','Žurnalai',3],['A3','Piešiniai',2],['B1','Dokumentai',2],['B2','Dekoracijos',3],['B3','Knygos',3]].map(([id,desc,n])=>`<button class="${archiveChoice===id?'chosen':''}" onclick="archiveChoice='${id}';feedback='';render()"><strong>▣ ${id}</strong><br>${desc}<br><span class="stripes">${'╱'.repeat(n)}</span></button>`).join('')}</div>`;
const hints=['Pažiūrėk į kiekvienos eilutės pirmąją raidę.','Pirmiausia rask, kas pasiskolino raktą. Tada apskaičiuok laiką nuo 22.40 iki 22.50. Ar galimybė atrakinti spintą jau įrodo knygos paėmimą?','Lygink ir drabužių spalvą, ir dėžės išvaizdą.','Pagalvok, kurie papročiai būdingi konkrečiai šventei, o kurie gali būti bendri.','Palygink Emilijos nurodytą rakto grąžinimo laiką su žurnalo įrašu.','Kuris radinys paaiškina, kodėl knygą reikėtų skubiai perkelti?','Pirmiausia atmesk A lentyną, tada dekoracijas ir patikrink juostų skaičių.'];return intro+body+`<div class="bar" style="margin-top:20px">${btn('Tikrinti atsakymą','checkAnswer()')}${btn('Užuomina','showHint()','btn secondary')}${btn('Įrodymų lenta','goEvidence()','btn ghost')}</div>${hint?`<div class="feedback hint"><strong>Užuomina:</strong> ${hints[i]}</div>`:''}${feedback?`<div class="feedback ${feedback.startsWith('Teisingai')?'good':'bad'}" role="status">${feedback}</div>`:''}</main>`}
function keyChoices(q,arr){return arr.map((x,i)=>`<label class="choice"><input type="radio" name="key${q}" value="${i}" ${keyAnswers[q]===String(i)?'checked':''} onchange="keyAnswers[${q}]=this.value">${escapeHtml(x)}</label>`).join('')}
function choices(arr){return arr.map((x,i)=>`<label class="choice"><input type="radio" name="ans" value="${i}" ${selection===String(i)?'checked':''} onchange="selection=this.value">${escapeHtml(x)}</label>`).join('')}
function showHint(){hint=!hint;render()}function checkAnswer(){const i=state.stage;let correct=false;if(i===0)correct=($('word')?.value||'').trim().toLocaleUpperCase('lt-LT')==='RAKTAS';else if(i===1)correct=keyAnswers.every((v,j)=>v===String([1,1,1][j]));else if(i===3)correct=['v','h','v','h','a','a'].every((x,j)=>$('trad'+j)?.value===x);else if(i===6)correct=archiveChoice==='B3';else correct=selection===String(({1:1,2:1,4:1,5:1})[i]);if(correct){feedback='Teisingai! Įrodymas įtrauktas į bylą.';if(!state.done.includes(i))state.done.push(i);state.stage=Math.min(7,i+1);save();screen='reward'}else feedback=i===1?'Dar ne. Patikrink, kas paėmė raktą, kiek laiko jį turėjo ir ką iš tikrųjų leidžia teigti šie faktai.':'Dar ne. Patikrink faktus ir pabandyk dar kartą.';if(screen==='reward')renderReward(i);else render()}
function renderReward(i){$('app').innerHTML=header()+`<main class="panel content"><div class="scene" aria-hidden="true">🔎</div><h1>Įrodymas Nr. ${i+1} atrastas!</h1><div class="paper">${clues[i]}${i===6?'<p><strong>Rastas Emilijos pasirašytas lapelis:</strong> „22.45 val. įdėjau knygą į sausą dėžę, nes prie spintos lašėjo vanduo. Vėliau nunešiau ją į archyvą. Pamiršau pranešti bibliotekininkei.“</p>':''}</div><p class="muted">Užrašyk įrodymą savo popierinėje byloje.</p>${btn(i===6?'Pateikti galutinę išvadą':'Kitas tyrimas',i===6?'goFinal()':'goTask()')}${btn('Įrodymų lenta','goEvidence()','btn secondary')}</main>`}
function finalHtml(){const evidenceOptions=[[2,'Emilija turėjo spintos raktą.'],[3,'Kameros požymiai atitiko Emilijos aprangą ir dėžę.'],[5,'Emilijos nurodytas rakto grąžinimo laikas prieštaravo žurnalui.'],[6,'Prie spintos lašėjo vanduo.'],[7,'B3 dėžėje rastas Emilijos pasirašytas lapelis.']];return `<main class="panel content"><h1>Galutinė bylos išvada</h1><p>Pasirink atsakymus ir bent du juos pagrindžiančius įrodymus. Vienas jų turi būti tiesiogiai susijęs su knygos radimu.</p><h2>Kas perkėlė knygą?</h2>${['Antanas','Emilija','Matas'].map(x=>`<label class="choice"><input type="radio" name="who" value="${x}" onchange="finalWho=this.value" ${finalWho===x?'checked':''}>${x}</label>`).join('')}<h2>Kodėl knyga buvo perkelta?</h2>${[['Pokštas','Norėta iškrėsti pokštą.'],['Apsauga','Norėta apsaugoti nuo vandens.'],['Pasisavinimas','Norėta knygą pasisavinti.']].map(([v,t])=>`<label class="choice"><input type="radio" name="why" value="${v}" onchange="finalWhy=this.value" ${finalWhy===v?'checked':''}>${t}</label>`).join('')}<h2>Pasirink įrodymus</h2>${evidenceOptions.map(([id,t])=>`<label class="checkrow"><input type="checkbox" value="${id}" onchange="toggleFinalEvidence(${id},this.checked)" ${finalEvidence.includes(id)?'checked':''}> ${t}</label>`).join('')}<div class="bar">${btn('Pateikti išvadą','checkFinal()')}${btn('Peržiūrėti įrodymus','goEvidence()','btn secondary')}</div>${feedback?`<div class="feedback ${feedback.startsWith('Byla')?'good':'bad'}" role="status">${feedback}</div>`:''}</main>`}
function toggleFinalEvidence(id,on){finalEvidence=on?[...new Set([...finalEvidence,id])]:finalEvidence.filter(x=>x!==id)}function checkFinal(){if(finalWho==='Emilija'&&finalWhy==='Apsauga'&&finalEvidence.includes(7)&&finalEvidence.some(x=>[2,3,6].includes(x))){screen='solved';$('app').innerHTML=header()+`<main class="panel hero"><div class="scene" aria-hidden="true">🏅 📖</div><h1>BYLA IŠSPRĘSTA!</h1><p class="sub">Knygą perkėlė Emilija. Ji norėjo apsaugoti ją nuo vandens, bet neinformavo bibliotekininkės. Pasirašytas lapelis ir kiti įrodymai patvirtino jos veiksmus. Laikrodis sustojo 23.13 val. dėl išsikrovusios baterijos; tai nebuvo knygos dingimo laikas.</p><p class="sub"><strong>Detektyvo pamoka:</strong> įtarimas nėra įrodymas. Svarbu patikrinti faktus ir suprasti motyvus.</p>${btn('Grįžti į būstinę','home()')}${btn('Spausdinti pažymėjimą','window.print()','btn secondary')}</main>`}else{feedback='Išvadoje dar trūksta tikslumo. Peržiūrėk rastą lapelį ir kitus įrodymus.';render()}}
render();</script>

</body></html>
